name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Skip PRs from forks — they can't access secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_URL: https://raw.githack.com/i-r0n/omni-standalone/main/previews/pr-${{ github.event.pull_request.number }}/index.html

    steps:
      - name: Checkout PR head
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build
        if: github.event.action != 'closed'
        run: npm run build

      - name: Inline into single HTML
        if: github.event.action != 'closed'
        run: node scripts/inline-build.mjs

      - name: Publish or remove preview
        env:
          GH_TOKEN: ${{ secrets.OMNI_STANDALONE_TOKEN }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/i-r0n/omni-standalone.git" target
          cd target
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DIR="previews/pr-${PR_NUMBER}"

          if [ "$ACTION" = "closed" ]; then
            if [ -d "$DIR" ]; then
              git rm -r "$DIR"
              git commit -m "Remove preview for PR #${PR_NUMBER} (closed)"
              for i in 1 2 3; do
                git push origin HEAD && break
                git pull --rebase origin HEAD
              done
            else
              echo "No preview directory to clean up."
            fi
          else
            mkdir -p "$DIR"
            cp "$GITHUB_WORKSPACE/omniverse-standalone.html" "$DIR/index.html"
            cp "$GITHUB_WORKSPACE/omniverse-standalone.html" "$DIR/omniverse-standalone.html"
            git add "$DIR"
            if git diff --cached --quiet; then
              echo "No content changes."
            else
              SHORT="${GITHUB_SHA:0:7}"
              git commit -m "Preview for PR #${PR_NUMBER} @ ${SHORT}"
              for i in 1 2 3; do
                git push origin HEAD && break
                git pull --rebase origin HEAD
              done
            fi
          fi

      - name: Upsert preview comment on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
          ACTION: ${{ github.event.action }}
        with:
          script: |
            const marker = '<!-- omni-preview -->';
            const action = process.env.ACTION;
            let body;
            if (action === 'closed') {
              body = `${marker}\nStandalone HTML preview removed (PR closed).`;
            } else {
              const url = process.env.PREVIEW_URL;
              const sha = context.payload.pull_request.head.sha.substring(0, 7);
              body = [
                marker,
                '### Standalone HTML preview',
                '',
                `Open on iPhone: ${url}`,
                '',
                `Built from \`${sha}\` — updates automatically on every push.`,
              ].join('\n');
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
