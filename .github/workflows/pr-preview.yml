name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # MANUAL refresh: rebuild a PR's preview on demand.  A push carrying
  # `[skip ci]` skips every workflow — this one included — so a branch that is
  # holding off on the (expensive) PR checks can still put its latest build
  # on the preview link.  `[skip ci]` does not apply to a manual dispatch.
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to rebuild the preview for
        required: true
        type: number

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  preview:
    # Skip PRs from forks — they can't access secrets.  (A manual dispatch is
    # started by someone with write access, so it needs no such guard.)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      PREVIEW_URL: https://raw.githack.com/i-r0n/omni-standalone/main/previews/pr-${{ github.event.pull_request.number || inputs.pr }}/index.html

    steps:
      - name: Check if event SHA is still the PR head
        id: guard
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          # A manual dispatch builds whatever the PR's head is right now.
          if [ -z "$EVENT_SHA" ]; then EVENT_SHA="$CURRENT_SHA"; fi
          echo "sha=${EVENT_SHA}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_SHA" != "$CURRENT_SHA" ]; then
            echo "::notice::Event commit ${EVENT_SHA} is stale (current PR head is ${CURRENT_SHA}). Skipping preview build to avoid overwriting with older content."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head
        if: github.event.action != 'closed' && steps.guard.outputs.stale != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.guard.outputs.sha }}

      - name: Setup Node
        if: github.event.action != 'closed' && steps.guard.outputs.stale != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed' && steps.guard.outputs.stale != 'true'
        run: npm ci

      - name: Build
        if: github.event.action != 'closed' && steps.guard.outputs.stale != 'true'
        run: npm run build

      - name: Inline into single HTML
        if: github.event.action != 'closed' && steps.guard.outputs.stale != 'true'
        run: node scripts/inline-build.mjs

      - name: Publish or remove preview
        if: github.event.action == 'closed' || steps.guard.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.OMNI_STANDALONE_TOKEN }}
          ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ steps.guard.outputs.sha }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/i-r0n/omni-standalone.git" target
          cd target
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DIR="previews/pr-${PR_NUMBER}"

          if [ "$ACTION" = "closed" ]; then
            if [ -d "$DIR" ]; then
              git rm -r "$DIR"
              git commit -m "Remove preview for PR #${PR_NUMBER} (closed)"
              for i in 1 2 3; do
                git push origin HEAD && break
                git pull --rebase origin HEAD
              done
            else
              echo "No preview directory to clean up."
            fi
          else
            mkdir -p "$DIR"
            cp "$GITHUB_WORKSPACE/omniverse-standalone.html" "$DIR/index.html"
            cp "$GITHUB_WORKSPACE/omniverse-standalone.html" "$DIR/omniverse-standalone.html"
            git add "$DIR"
            if git diff --cached --quiet; then
              echo "No content changes."
            else
              SHORT="${HEAD_SHA:0:7}"
              git commit -m "Preview for PR #${PR_NUMBER} @ ${SHORT}"
              for i in 1 2 3; do
                git push origin HEAD && break
                git pull --rebase origin HEAD
              done
            fi
          fi

      - name: Upsert preview comment on PR
        if: github.event.action == 'closed' || steps.guard.outputs.stale != 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
          ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ steps.guard.outputs.sha }}
        with:
          script: |
            const marker = '<!-- omni-preview -->';
            const action = process.env.ACTION;
            let body;
            if (action === 'closed') {
              body = `${marker}\nStandalone HTML preview removed (PR closed).`;
            } else {
              const url = process.env.PREVIEW_URL;
              const sha = (process.env.HEAD_SHA || '').substring(0, 7);
              body = [
                marker,
                '### Standalone HTML preview',
                '',
                `Open on iPhone: ${url}`,
                '',
                `Built from \`${sha}\` — updates automatically on every push, or run the PR preview workflow by hand (a \`[skip ci]\` push skips it).`,
              ].join('\n');
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PR_NUMBER),
                body,
              });
            }
