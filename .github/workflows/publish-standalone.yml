name: Publish standalone HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-standalone
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inline build into single HTML
        run: node scripts/inline-build.mjs

      - name: Push to public mirror
        env:
          GH_TOKEN: ${{ secrets.OMNI_STANDALONE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::OMNI_STANDALONE_TOKEN secret is not set."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/i-r0n/omni-standalone.git" target
          cp omniverse-standalone.html target/omniverse-standalone.html
          cd target
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omniverse-standalone.html
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          SOURCE_SHA="${GITHUB_SHA::7}"
          git commit -m "Update from i-r0n/omni@${SOURCE_SHA}"
          git push origin HEAD
