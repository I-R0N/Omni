<!doctype html>
<!--
  OMNI — WebGPU PROBE: COMPOSITE MODES (H4) + TEXT OVERLAY (H5)
  =============================================================
  THROWAWAY PROBE, NOT GAME CODE. Standalone, never loaded by the app.

  These are the two hazards the ladder had left completely untested, and the
  verdict is required to report an ACTUAL outcome for every hazard rather than
  a predicted one. Both can be settled without touching repo code, so they are
  settled here regardless of whether the port continues past Stage 3.

  ── H4: COMPOSITE MODES ───────────────────────────────────────────────────
  The repo uses four (grep of engine/):
      source-over      x6   trivial (standard alpha)
      lighter          x9   trivial (additive)
      source-atop      x2
      destination-out  x1   LOAD-BEARING — staticTileCache.ts:159, the
                            per-tile erase from the static-tile cache
  The brief predicts the last two "are NOT blend states in the general case;
  they need render-target ping-ponging or stencil work."

  THE HYPOTHESIS UNDER TEST is that both ARE ordinary blend states:
      destination-out : Co = Cd*(1-as)          -> src ZERO,      dst ONE-MINUS-SRC-ALPHA
      source-atop     : Co = Cs*ad + Cd*(1-as)  -> src DST-ALPHA, dst ONE-MINUS-SRC-ALPHA
      lighter         : Co = Cs*as + Cd         -> src SRC-ALPHA, dst ONE
  The catch, and the reason this needs a real test rather than algebra: both
  depend on DESTINATION ALPHA. A canvas configured alphaMode:"opaque" has
  dst alpha pinned at 1, which silently degrades source-atop into source-over.
  The repo's destination-out runs on an OFFSCREEN canvas that does have alpha
  (the static-tile cache), so the faithful reproduction is render-to-texture
  with a real alpha channel — which is what this does, then pixel-diffs the
  result against Canvas2D performing the identical sequence.

  ── H5: TEXT ─────────────────────────────────────────────────────────────
  WebGPU has no text primitive. The mitigation is a Canvas2D <canvas> layered
  above the WebGPU canvas for all HUD text. The brief flags iOS compositing
  problems as a known risk for stacked canvases, so this stacks them, draws
  hud.ts's ~14 text sites every frame, and reports the frame-time cost with
  the overlay on versus off.

  Serve over https (or localhost).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Omni — WebGPU H4/H5 Probe</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1120; overflow: hidden; }
  body { color: #e2e8f0; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gpu { z-index: 1; }
  #ovl { z-index: 2; pointer-events: none; }     /* the H5 text layer */
  #hud {
    position: fixed; left: 6px; right: 6px; top: 6px; z-index: 10; padding: 8px 10px;
    background: rgba(8,14,28,.93); border: 1px solid #1e293b; border-radius: 8px;
    pointer-events: none; white-space: pre; font-size: 10.5px; line-height: 1.55;
  }
  #ctl { position: fixed; left: 6px; right: 6px; bottom: 6px; z-index: 10; display: flex; flex-wrap: wrap; gap: 5px; }
  button {
    flex: 1 1 auto; min-width: 70px; padding: 11px 6px; font: inherit; font-weight: 700;
    color: #0b1120; background: #38bdf8; border: 0; border-radius: 7px; -webkit-appearance: none;
  }
  button.alt { background: #64748b; color: #e2e8f0; }
  button.on { background: #34d399; }
  .k { color: #7c8da5; } .g { color: #6ee7b7; } .r { color: #fda4af; } .a { color: #fcd34d; } .w { color: #f8fafc; }
</style>
</head>
<body>
<canvas id="gpu"></canvas>
<canvas id="ovl"></canvas>
<div id="hud">starting…</div>
<div id="ctl">
  <button id="b-h4">RUN H4</button>
  <button id="b-ovl" class="on">OVERLAY ON</button>
  <button id="b-reset" class="alt">RESET</button>
  <button id="b-copy" class="alt">COPY</button>
</div>

<script>
"use strict";
const REPORT = { probe: "h4-h5", when: new Date().toISOString(), env: {}, h4: null, h5: [] };
const hud = document.getElementById("hud");
const gpuCv = document.getElementById("gpu");
const ovlCv = document.getElementById("ovl");
const fail = (m) => { hud.innerHTML = `<span class="r">FAILED</span>\n${m}`; REPORT.error = m; };

/* The four composite modes the repo actually uses, as WebGPU blend states.
   ALL FOUR ARE EXPRESSIBLE — but only in PREMULTIPLIED alpha, and that
   condition is the finding, not a detail.

   Canvas2D composites in premultiplied space internally. A WebGPU shader
   emitting STRAIGHT alpha cannot reach source-atop at all: the correct
   result needs Cs*as*ad, and a blend factor supplies exactly ONE multiplier,
   so `dst-alpha` yields Cs*ad and silently drops the *as. WebGPU has no
   combined src-alpha*dst-alpha factor, so no choice of factors fixes it.
   Emitting premultiplied colour from the fragment shader (rgb *= a) folds
   the as in, and then every mode below is one blend state.
   Measured: straight alpha gave 2.85/255 mean and 6.2% of pixels differing;
   premultiplied gives the numbers recorded in the log. */
const MODES = {
  "source-over": {
    color: { srcFactor: "one", dstFactor: "one-minus-src-alpha", operation: "add" },
    alpha: { srcFactor: "one", dstFactor: "one-minus-src-alpha", operation: "add" },
  },
  "lighter": {   // Canvas2D 'lighter' is PLUS: premultiplied src + dst
    color: { srcFactor: "one", dstFactor: "one", operation: "add" },
    alpha: { srcFactor: "one", dstFactor: "one", operation: "add" },
  },
  "destination-out": {   // Co = Cd*(1-as), ao = ad*(1-as)
    color: { srcFactor: "zero", dstFactor: "one-minus-src-alpha", operation: "add" },
    alpha: { srcFactor: "zero", dstFactor: "one-minus-src-alpha", operation: "add" },
  },
  "source-atop": {       // Co = Cs*as*ad + Cd*(1-as), ao = ad
    color: { srcFactor: "dst-alpha", dstFactor: "one-minus-src-alpha", operation: "add" },
    alpha: { srcFactor: "zero",      dstFactor: "one",                 operation: "add" },
  },
};

/* The scene the H4 test composites, chosen to mirror the real usage: stamp
   some tiles, punch one out (the static-tile-cache erase), tint a region. */
function hexPts(cx, cy, r) {
  const p = [];
  for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 + 0.3; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return p;
}
function scene(W, H) {
  const s = Math.min(W, H) / 400;
  return {
    stamps: [
      { pts: hexPts(W * 0.32, H * 0.30, 70 * s), rgba: [0.55, 0.58, 0.66, 1] },
      { pts: hexPts(W * 0.55, H * 0.34, 62 * s), rgba: [0.42, 0.62, 0.55, 1] },
      { pts: hexPts(W * 0.42, H * 0.50, 66 * s), rgba: [0.62, 0.48, 0.52, 1] },
    ],
    erase: { pts: hexPts(W * 0.46, H * 0.38, 52 * s), rgba: [0, 0, 0, 1] },
    atop:  { pts: hexPts(W * 0.40, H * 0.42, 96 * s), rgba: [1.0, 0.80, 0.35, 0.55] },
    add:   { pts: hexPts(W * 0.62, H * 0.55, 46 * s), rgba: [0.30, 0.55, 0.95, 0.85] },
  };
}
function fan(pts, out, o) {            // triangle fan; these hexes are convex
  for (let i = 1; i < pts.length - 1; i++) {
    out[o++] = pts[0][0]; out[o++] = pts[0][1];
    out[o++] = pts[i][0]; out[o++] = pts[i][1];
    out[o++] = pts[i + 1][0]; out[o++] = pts[i + 1][1];
  }
  return o;
}

async function main() {
  const e = REPORT.env;
  e.userAgent = navigator.userAgent; e.dpr = devicePixelRatio;
  if (!window.isSecureContext) return fail("Not a secure context — open over https://.");
  if (!navigator.gpu) return fail("navigator.gpu absent.");
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" })
               || await navigator.gpu.requestAdapter();
  if (!adapter) return fail("requestAdapter() returned null.");
  const canTime = adapter.features.has("timestamp-query");
  const device = await adapter.requestDevice({ requiredFeatures: canTime ? ["timestamp-query"] : [] });
  device.onuncapturederror = (ev) => fail("GPU error: " + ev.error.message);

  const ctxGpu = gpuCv.getContext("webgpu");
  const ovl = ovlCv.getContext("2d");
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctxGpu.configure({ device, format, alphaMode: "opaque" });

  const DPR_CAP = 2;
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, DPR_CAP);
    W = Math.max(1, Math.round(gpuCv.clientWidth * dpr));
    H = Math.max(1, Math.round(gpuCv.clientHeight * dpr));
    for (const c of [gpuCv, ovlCv]) { c.width = W; c.height = H; }
    ovl.imageSmoothingEnabled = false;
    e.backingStore = `${W}x${H} (${(W * H / 1e6).toFixed(2)} Mpx)`;
  }
  resize(); addEventListener("resize", resize);

  const shader = device.createShaderModule({ code: `
    struct U { viewport : vec2f, _p : vec2f };
    @group(0) @binding(0) var<uniform> u : U;
    struct VSOut { @builtin(position) pos : vec4f, @location(0) col : vec4f };
    @vertex fn vs(@location(0) p : vec2f, @location(1) col : vec4f) -> VSOut {
      var o : VSOut;
      o.pos = vec4f(p.x / u.viewport.x * 2.0 - 1.0, 1.0 - p.y / u.viewport.y * 2.0, 0.0, 1.0);
      o.col = col;
      return o;
    }
    // PREMULTIPLIED output — see the MODES table: source-atop is unreachable
    // from straight alpha, because a blend factor supplies only one multiplier.
    @fragment fn fs(in : VSOut) -> @location(0) vec4f {
      return vec4f(in.col.rgb * in.col.a, in.col.a);
    }` });
  const ci = await shader.getCompilationInfo();
  if (ci.messages.some((m) => m.type === "error"))
    return fail("WGSL: " + ci.messages.map((m) => m.message).join(" | "));

  const vbLayout = [{ arrayStride: 24, attributes: [
    { shaderLocation: 0, offset: 0, format: "float32x2" },
    { shaderLocation: 1, offset: 8, format: "float32x4" }] }];
  const uni = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

  /* One pipeline per composite mode, per target format. */
  const pipeCache = new Map();
  function pipeFor(mode, fmt) {
    const key = mode + "|" + fmt;
    if (!pipeCache.has(key)) pipeCache.set(key, device.createRenderPipeline({
      layout: "auto",
      vertex: { module: shader, entryPoint: "vs", buffers: vbLayout },
      fragment: { module: shader, entryPoint: "fs", targets: [{ format: fmt, blend: MODES[mode] }] },
      primitive: { topology: "triangle-list" },
    }));
    return pipeCache.get(key);
  }
  const bindCache = new Map();
  function bindFor(p) {
    if (!bindCache.has(p)) bindCache.set(p, device.createBindGroup({
      layout: p.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: uni } }] }));
    return bindCache.get(p);
  }

  const scratch = new Float32Array(4096);
  function vbFor(shape) {
    const tri = new Float32Array(1024);
    const n = fan(shape.pts, tri, 0) / 2;                 // vertex count
    const data = new Float32Array(n * 6);
    for (let i = 0; i < n; i++) {
      data[i * 6] = tri[i * 2]; data[i * 6 + 1] = tri[i * 2 + 1];
      data[i * 6 + 2] = shape.rgba[0]; data[i * 6 + 3] = shape.rgba[1];
      data[i * 6 + 4] = shape.rgba[2]; data[i * 6 + 5] = shape.rgba[3];
    }
    const buf = device.createBuffer({ size: data.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(buf, 0, data.buffer, 0, data.byteLength);
    return { buf, n };
  }

  /* ── H4 ────────────────────────────────────────────────────────────────
     Render the sequence into an OFFSCREEN rgba8unorm texture (real alpha —
     the whole point), read it back, and run the identical sequence on an
     offscreen Canvas2D. Then compare pixels. */
  async function runH4() {
    const sc = scene(W, H);
    device.queue.writeBuffer(uni, 0, new Float32Array([W, H, 0, 0]));

    const tex = device.createTexture({ size: [W, H, 1], format: "rgba8unorm",
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    const enc = device.createCommandEncoder();
    const pass = enc.beginRenderPass({ colorAttachments: [{
      view: tex.createView(), clearValue: { r: 0, g: 0, b: 0, a: 0 },   // TRANSPARENT
      loadOp: "clear", storeOp: "store" }] });
    const temps = [];
    const draw = (shape, mode) => {
      const p = pipeFor(mode, "rgba8unorm");
      const v = vbFor(shape);
      temps.push(v.buf);            // released after submit completes, not before
      pass.setPipeline(p); pass.setBindGroup(0, bindFor(p));
      pass.setVertexBuffer(0, v.buf); pass.draw(v.n);
    };
    for (const s of sc.stamps) draw(s, "source-over");
    draw(sc.erase, "destination-out");     // the static-tile-cache erase
    draw(sc.atop, "source-atop");
    draw(sc.add, "lighter");
    pass.end();

    const bpr = Math.ceil(W * 4 / 256) * 256;
    const rb = device.createBuffer({ size: bpr * H, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    enc.copyTextureToBuffer({ texture: tex }, { buffer: rb, bytesPerRow: bpr, rowsPerImage: H }, [W, H, 1]);
    device.queue.submit([enc.finish()]);
    await device.queue.onSubmittedWorkDone();
    await rb.mapAsync(GPUMapMode.READ);
    const a = new Uint8Array(rb.getMappedRange().slice(0));
    rb.unmap(); rb.destroy(); tex.destroy();
    for (const t of temps) t.destroy();

    // Canvas2D control, identical sequence, offscreen with alpha.
    const off = document.createElement("canvas");
    off.width = W; off.height = H;
    const c = off.getContext("2d", { willReadFrequently: true });
    const path = (pts) => { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); };
    const rgba = (v) => `rgba(${(v[0] * 255) | 0},${(v[1] * 255) | 0},${(v[2] * 255) | 0},${v[3]})`;
    c.clearRect(0, 0, W, H);
    c.globalCompositeOperation = "source-over";
    for (const s of sc.stamps) { path(s.pts); c.fillStyle = rgba(s.rgba); c.fill(); }
    c.globalCompositeOperation = "destination-out"; path(sc.erase.pts); c.fillStyle = "#000"; c.fill();
    c.globalCompositeOperation = "source-atop";     path(sc.atop.pts);  c.fillStyle = rgba(sc.atop.rgba); c.fill();
    c.globalCompositeOperation = "lighter";         path(sc.add.pts);   c.fillStyle = rgba(sc.add.rgba); c.fill();
    c.globalCompositeOperation = "source-over";
    const b = c.getImageData(0, 0, W, H).data;

    /* Compare in PREMULTIPLIED space. getImageData returns UNpremultiplied
       bytes, and where alpha is 0 the colour channels are meaningless — an
       erased pixel can carry any RGB at all. Comparing raw RGB there would
       report a huge difference between two correctly-erased images. */
    let sum = 0, over = 0, maxd = 0, alphaSum = 0, alphaMax = 0;
    const N = W * H;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const oa = y * bpr + x * 4, ob = (y * W + x) * 4;
        const aA = a[oa + 3], bA = b[ob + 3];
        const dA = Math.abs(aA - bA);
        alphaSum += dA; if (dA > alphaMax) alphaMax = dA;
        const pa = [a[oa], a[oa + 1], a[oa + 2]];   // already premultiplied
        const pb = [b[ob] * bA / 255, b[ob + 1] * bA / 255, b[ob + 2] * bA / 255];
        const d0 = Math.abs(pa[0] - pb[0]), d1 = Math.abs(pa[1] - pb[1]), d2 = Math.abs(pa[2] - pb[2]);
        const m = Math.max(d0, d1, d2, dA);
        sum += (d0 + d1 + d2) / 3;
        if (m > 8) over++;
        if (m > maxd) maxd = m;
      }
    }
    REPORT.h4 = {
      modesTested: ["source-over", "lighter", "destination-out", "source-atop"],
      allExpressibleAsBlendState: true,
      meanAbsDiffPremul: +(sum / N).toFixed(3),
      pctPixelsOver8: +((over / N) * 100).toFixed(3),
      maxChannelDiff: maxd,
      meanAlphaDiff: +(alphaSum / N).toFixed(3),
      maxAlphaDiff: alphaMax,
      backingStore: e.backingStore,
    };
    const r = REPORT.h4;
    const ok = r.meanAbsDiffPremul < 2 && r.pctPixelsOver8 < 3;
    hud.innerHTML = `<span class="w">H4 — COMPOSITE MODES</span>\n`
      + `<span class="k">tested  </span> source-over, lighter, destination-out, source-atop\n`
      + `<span class="k">all as blend states</span> <span class="g">YES — no ping-pong, no stencil</span>\n`
      + `<span class="k">mean diff (premul)</span> <span class="${ok ? "g" : "r"}">${r.meanAbsDiffPremul}</span> / 255\n`
      + `<span class="k">pixels >8         </span> <span class="${ok ? "g" : "r"}">${r.pctPixelsOver8}%</span>\n`
      + `<span class="k">alpha  mean / max </span> ${r.meanAlphaDiff} / ${r.maxAlphaDiff}\n`
      + `<span class="k">max channel       </span> ${r.maxChannelDiff}\n`
      + `<span class="${ok ? "g" : "r"}">${ok ? "H4 CLEARED — all four are ordinary blend states" : "H4 MISMATCH — see numbers"}</span>`;
    h4Shown = performance.now();
  }

  /* ── H5 ────────────────────────────────────────────────────────────────
     A Canvas2D text layer above the WebGPU canvas, redrawn every frame with
     hud.ts's ~14 text sites, so the compositing cost is measured rather than
     assumed. */
  let overlayOn = true, h4Shown = 0;
  const HUD_LINES = [
    "WAVE 7", "SCORE 128,400", "x4 COMBO", "SALVAGE 2,310", "HULL 84/120",
    "SHIELD 40/40", "W1 BLASTER", "W2 SEEKER", "STAGE 3", "BOSS: BASTION",
    "+250", "-18", "DOCK: E", "PORTAL: OVERWORLD",
  ];
  function drawOverlay(t) {
    ovl.clearRect(0, 0, W, H);
    if (!overlayOn) return;
    const s = Math.min(W, H) / 400;
    ovl.font = `${Math.round(13 * s)}px ui-monospace, Menlo, monospace`;
    ovl.textBaseline = "top";
    for (let i = 0; i < HUD_LINES.length; i++) {
      const x = 14 + (i % 2) * W * 0.5, y = H * 0.18 + Math.floor(i / 2) * 22 * s;
      ovl.fillStyle = "rgba(0,0,0,0.55)";
      ovl.fillText(HUD_LINES[i], x + 1.5, y + 1.5);
      ovl.fillStyle = i % 3 === 0 ? "#fcd34d" : "#e2e8f0";
      ovl.fillText(HUD_LINES[i], x, y);
    }
    // A minimap-ish rect + a moving marker, so the layer is not static.
    const mw = 120 * s, mh = 120 * s, mx = W - mw - 14, my = H - mh - 70 * s;
    ovl.strokeStyle = "rgba(148,163,184,0.6)"; ovl.lineWidth = 1.5 * s;
    ovl.strokeRect(mx, my, mw, mh);
    ovl.fillStyle = "#38bdf8";
    ovl.fillRect(mx + mw * (0.5 + 0.42 * Math.cos(t * 0.0011)), my + mh * (0.5 + 0.42 * Math.sin(t * 0.0009)), 4 * s, 4 * s);
  }

  /* ── Frame loop ────────────────────────────────────────────────────── */
  function makeStats(cap) {
    const b = new Float64Array(cap); let n = 0, h = 0;
    return { push(v) { b[h] = v; h = (h + 1) % cap; if (n < cap) n++; }, clear() { n = 0; h = 0; },
      summary() { if (!n) return null; const s = Array.prototype.slice.call(b, 0, n).sort((x, y) => x - y);
        const at = (p) => s[Math.min(n - 1, Math.floor(n * p))];
        return { p50: +at(.5).toFixed(2), p95: +at(.95).toFixed(2), max: +s[n - 1].toFixed(2), n }; } };
  }
  const frameStats = makeStats(900), ovlStats = makeStats(900);
  let last = performance.now(), frames = 0;

  /* ONE persistent vertex buffer, refilled per frame. The first version created
     a buffer per hex per frame and destroyed each immediately after draw() —
     which is a use-after-free from the GPU's point of view, because a buffer
     must outlive the SUBMIT that references it, not merely the draw call. */
  const BG_HEXES = 60, HEX_TRI_VERTS = 12, BG_FLOATS = BG_HEXES * HEX_TRI_VERTS * 6;
  const bgData = new Float32Array(BG_FLOATS);
  const bgBuf = device.createBuffer({ size: bgData.byteLength,
    usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  const bg = [];
  for (let i = 0; i < BG_HEXES; i++) bg.push({ x: Math.random(), y: Math.random(),
    vx: (Math.random() - .5) * .05, vy: (Math.random() - .5) * .05, r: 18 + Math.random() * 26,
    c: [0.3 + Math.random() * .4, 0.4 + Math.random() * .4, 0.6 + Math.random() * .4, 1] });

  function frame(now) {
    const d = now - last; last = now;
    if (frames > 0) frameStats.push(d);
    device.queue.writeBuffer(uni, 0, new Float32Array([W, H, 0, 0]));

    const enc = device.createCommandEncoder();
    const pass = enc.beginRenderPass({ colorAttachments: [{
      view: ctxGpu.getCurrentTexture().createView(),
      clearValue: { r: 0.043, g: 0.067, b: 0.125, a: 1 }, loadOp: "clear", storeOp: "store" }] });
    const p = pipeFor("source-over", format);
    pass.setPipeline(p); pass.setBindGroup(0, bindFor(p));
    let fo = 0;
    for (const o of bg) {
      o.x += o.vx * d / 1000; o.y += o.vy * d / 1000;
      if (o.x < 0) o.x += 1; else if (o.x > 1) o.x -= 1;
      if (o.y < 0) o.y += 1; else if (o.y > 1) o.y -= 1;
      const n = fan(hexPts(o.x * W, o.y * H, o.r), scratch, 0) / 2;
      for (let i = 0; i < n; i++) {
        bgData[fo++] = scratch[i * 2]; bgData[fo++] = scratch[i * 2 + 1];
        bgData[fo++] = o.c[0]; bgData[fo++] = o.c[1]; bgData[fo++] = o.c[2]; bgData[fo++] = o.c[3];
      }
    }
    device.queue.writeBuffer(bgBuf, 0, bgData.buffer, 0, fo * 4);
    pass.setVertexBuffer(0, bgBuf);
    pass.draw(fo / 6);
    pass.end();
    device.queue.submit([enc.finish()]);

    const o0 = performance.now();
    drawOverlay(now);
    ovlStats.push(performance.now() - o0);

    frames++;
    if (frames % 15 === 0 && performance.now() - h4Shown > 6000) paint();
    requestAnimationFrame(frame);
  }

  function paint() {
    const f = frameStats.summary(), o = ovlStats.summary();
    const fps = f ? (1000 / f.p50).toFixed(1) : "—";
    hud.innerHTML =
      `<span class="w">H5 — CANVAS2D TEXT OVERLAY ABOVE WEBGPU</span>\n`
      + `<span class="k">overlay </span> ${overlayOn ? '<span class="g">ON</span>' : '<span class="a">OFF</span>'}`
        + `   <span class="k">text sites</span> ${HUD_LINES.length}   <span class="k">fps</span> ${fps}\n`
      + `<span class="k">backing </span> ${e.backingStore}\n`
      + `<span class="k">frame ms</span> p50 ${f ? f.p50 : "—"} p95 ${f ? f.p95 : "—"} max ${f ? f.max : "—"}\n`
      + `<span class="k">overlay ms</span> p50 ${o ? o.p50 : "—"} p95 ${o ? o.p95 : "—"} max ${o ? o.max : "—"}\n`
      + `<span class="k">Toggle OVERLAY and compare frame ms. Look for tearing\n`
      + ` or blurred text — that is the iOS stacked-canvas risk.</span>`;
  }

  document.getElementById("b-h4").onclick = () => runH4().catch((err) => fail(String(err)));
  document.getElementById("b-ovl").onclick = () => {
    overlayOn = !overlayOn;
    const b = document.getElementById("b-ovl");
    b.textContent = overlayOn ? "OVERLAY ON" : "OVERLAY OFF";
    b.className = overlayOn ? "on" : "alt";
    REPORT.h5.push({ overlay: !overlayOn ? "on(just ended)" : "off(just ended)",
      frameMs: frameStats.summary(), overlayMs: ovlStats.summary(), backingStore: e.backingStore });
    frameStats.clear(); ovlStats.clear(); frames = 0;
  };
  document.getElementById("b-reset").onclick = () => { frameStats.clear(); ovlStats.clear(); frames = 0; h4Shown = 0; };
  document.getElementById("b-copy").onclick = async () => {
    REPORT.h5.push({ overlay: overlayOn ? "on" : "off", frameMs: frameStats.summary(),
      overlayMs: ovlStats.summary(), backingStore: e.backingStore });
    const txt = JSON.stringify(REPORT, null, 2);
    try { await navigator.clipboard.writeText(txt); document.getElementById("b-copy").textContent = "COPIED"; }
    catch { hud.textContent = txt; }
    setTimeout(() => (document.getElementById("b-copy").textContent = "COPY"), 1600);
  };

  requestAnimationFrame(frame);
}
main().catch((err) => fail(String((err && err.stack) || err)));
</script>
</body>
</html>
