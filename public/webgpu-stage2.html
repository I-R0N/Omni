<!doctype html>
<!--
  OMNI — WebGPU STAGE 2: THE HARDEST PRIMITIVE  (KILL GATE 2)
  ===========================================================
  THROWAWAY HARNESS, NOT GAME CODE. Standalone, imports nothing, never loaded
  by the app. Delete freely when the spike concludes.

  Reproduces the single most demanding thing Omni's renderer does — a DENTED
  ROCK TILE — in WebGPU and in Canvas2D, in the same page, on the same device,
  drawing the same scene, so the two can be compared honestly.

  Per the brief, each tile is:
    1. an ARBITRARY FILLED POLYGON from a runtime-mutable vertex list,
       triangulated on a dirty flag (NOT at load),
    2. with a STROKED OUTLINE at a real lineWidth and correct joins,
    3. plus a RADIAL-GRADIENT BLOOM clipped to the polygon,
    4. drawn 500x with per-instance transforms at the true backing store,
    5. with 10% of instances re-triangulating every frame (dent churn).

  FIDELITY NOTES — taken from the real renderer, not invented:
    * The bloom is NOT ctx.clip(). tileShapes.ts:194-213 builds the polygon
      path and fills it with a radial gradient as fillStyle, which confines
      the bloom for free. Reproduced that way here.
    * The bloom centre is the CLOSEST POINT ON THE POLYGON OUTLINE to the
      player (tileShapes.ts:167-191), not the centroid — it slides along the
      perimeter as the player orbits. Centring it would make the WebGPU side
      cheaper than the thing it claims to reproduce.
    * intensity = (1 - dist/range)^2, radius = tileR * (0.75 + 2.625*intensity),
      gradient from colour to the same colour at alpha 0. Same constants.
    * Dents mutate the RADII of a fixed vertex count, which is how rock tiles
      actually dent (DropSystem shrinks the polygon per hit). Fixed vertex
      count is also what lets each instance own a stable slot in the vertex
      buffer, so a dent rewrites one sub-range instead of the whole thing.

  MEASUREMENT — read this before believing any number here.
  Stage 1 established that frame time on this device is VSYNC-LOCKED at 17ms:
  any renderer whose work fits the budget reads as exactly 17ms, so comparing
  frame times would report "17 vs 17" and conclude nothing. Two honest
  instruments are used instead:
    * GPU/CPU WORK time per frame (timestamp-query for WebGPU; for Canvas2D,
      the JS issuing cost, which UNDER-reports it — see the caveat in the UI).
    * THE RAMP: raise the instance count until 60fps breaks, and report the
      count each renderer sustains. Immune to vsync, immune to both timers'
      dishonesty, and it is the number that actually answers "which is
      faster". This is the primary evidence.

  Serve over https (or localhost) — WebGPU needs a secure context.
-->
<html lang="en">

<canvas id="c2d"></canvas>

  <button id="b-mode">WEBGPU</button>
  <button id="b-split" class="alt">SPLIT</button>

<script>
"use strict";

const REPORT = { stage: "2", when: new Date().toISOString(), env: {}, gpu: {}, runs: [] };
const hud = document.getElementById("hud");
const gpuCv = document.getElementById("gpu");
const c2dCv = document.getElementById("c2d");

const fail = (m) => { hud.innerHTML = `<span class="r">FAILED</span>\n${m}`; REPORT.error = m; };

/* ═══ GEOMETRY ════════════════════════════════════════════════════════════
   Everything below is renderer-agnostic: the same polygons, the same dent
   churn and the same bloom maths feed both the WebGPU and the Canvas2D path,
   so the comparison is of RENDERERS, not of two different scenes. */

const NVERT = 12;            // fixed vertex count; dents mutate RADII
const BLOOM_RANGE = 420;     // px, stands in for SHARD_VARIANTS glow.range
const PEAK_ALPHA = 0.55;

let seed = 12345;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

function makeTile(W, H) {
  const t = {
    x: rnd() * W, y: rnd() * H, rot: rnd() * Math.PI * 2, spin: (rnd() - 0.5) * 0.4,
    radius: 26 + rnd() * 16,
    base: [0.42 + rnd() * 0.12, 0.40 + rnd() * 0.12, 0.45 + rnd() * 0.12],
    r: new Float32Array(NVERT),      // per-vertex radius (the dent state)
    pts: new Float32Array(NVERT * 2),
    fillTris: null, strokeTris: null, dirty: true,
  };
  for (let i = 0; i < NVERT; i++) t.r[i] = 0.82 + rnd() * 0.18;
  return t;
}
/* A dent shrinks a contiguous arc of vertices — the same shape of mutation
   the real dent system makes, and the thing that forces re-triangulation. */
function dent(t) {
  const at = (rnd() * NVERT) | 0, span = 2 + ((rnd() * 3) | 0);
  for (let k = 0; k < span; k++) {
    const i = (at + k) % NVERT;
    t.r[i] = Math.max(0.42, t.r[i] - (0.10 + rnd() * 0.14));
  }
  t.dirty = true;
}
function buildPoints(t) {
  for (let i = 0; i < NVERT; i++) {
    const a = (i / NVERT) * Math.PI * 2;
    t.pts[i * 2]     = Math.cos(a) * t.radius * t.r[i];
    t.pts[i * 2 + 1] = Math.sin(a) * t.radius * t.r[i];
  }
}

/* ── Ear-clipping triangulation ───────────────────────────────────────────
   Deliberately REAL ear clipping rather than a centroid fan. A fan is valid
   for these radial polygons and is nearly free — which is exactly why using
   one would understate the cost of the thing being measured. An arbitrary
   mutable polygon needs ear clipping, so ear clipping is what gets timed. */
const _idx = new Int32Array(NVERT);
function triangulate(pts, n, out) {
  for (let i = 0; i < n; i++) _idx[i] = i;
  let m = n, o = 0, guard = 0;
  const cross = (ax, ay, bx, by, cx, cy) => (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
  while (m > 3 && guard++ < 4 * n) {
    let clipped = false;
    for (let i = 0; i < m; i++) {
      const i0 = _idx[(i + m - 1) % m], i1 = _idx[i], i2 = _idx[(i + 1) % m];
      const ax = pts[i0 * 2], ay = pts[i0 * 2 + 1];
      const bx = pts[i1 * 2], by = pts[i1 * 2 + 1];
      const cx = pts[i2 * 2], cy = pts[i2 * 2 + 1];
      if (cross(ax, ay, bx, by, cx, cy) <= 0) continue;      // reflex — not an ear
      let contains = false;
      for (let j = 0; j < m; j++) {
        const p = _idx[j];
        if (p === i0 || p === i1 || p === i2) continue;
        const px = pts[p * 2], py = pts[p * 2 + 1];
        if (cross(ax, ay, bx, by, px, py) >= 0 &&
            cross(bx, by, cx, cy, px, py) >= 0 &&
            cross(cx, cy, ax, ay, px, py) >= 0) { contains = true; break; }
      }
      if (contains) continue;
      out[o++] = ax; out[o++] = ay; out[o++] = bx; out[o++] = by; out[o++] = cx; out[o++] = cy;
      for (let j = i; j < m - 1; j++) _idx[j] = _idx[j + 1];
      m--; clipped = true; break;
    }
    if (!clipped) break;   // degenerate; emit what remains as a fan
  }
  for (let i = 1; i < m - 1; i++) {
    const a = _idx[0], b = _idx[i], c = _idx[i + 1];
    out[o++] = pts[a * 2]; out[o++] = pts[a * 2 + 1];
    out[o++] = pts[b * 2]; out[o++] = pts[b * 2 + 1];
    out[o++] = pts[c * 2]; out[o++] = pts[c * 2 + 1];
  }
  return o;
}

/* ── Stroke expansion ─────────────────────────────────────────────────────
   ctx.stroke() with a lineWidth has no WebGPU equivalent; the outline must
   become geometry. Miter joins with a limit, falling back to a clamp, which
   is what the brief flags as the underestimated half of H2. */
const MITER_LIMIT = 4;
function expandStroke(pts, n, halfW, out) {
  let o = 0;
  const mx = new Float32Array(n), my = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const p = (i + n - 1) % n, q = (i + 1) % n;
    let e1x = pts[i * 2] - pts[p * 2], e1y = pts[i * 2 + 1] - pts[p * 2 + 1];
    let e2x = pts[q * 2] - pts[i * 2], e2y = pts[q * 2 + 1] - pts[i * 2 + 1];
    let l1 = Math.hypot(e1x, e1y) || 1, l2 = Math.hypot(e2x, e2y) || 1;
    e1x /= l1; e1y /= l1; e2x /= l2; e2y /= l2;
    const n1x = -e1y, n1y = e1x, n2x = -e2y, n2y = e2x;   // left normals
    let sx = n1x + n2x, sy = n1y + n2y;
    const sl = Math.hypot(sx, sy);
    if (sl < 1e-6) { sx = n1x; sy = n1y; }                // 180° reversal
    else { sx /= sl; sy /= sl; }
    let scale = 1 / Math.max(0.1, sx * n1x + sy * n1y);   // miter length
    if (scale > MITER_LIMIT) scale = MITER_LIMIT;         // bevel-ish clamp
    mx[i] = sx * halfW * scale; my[i] = sy * halfW * scale;
  }
  for (let i = 0; i < n; i++) {
    const q = (i + 1) % n;
    const ax = pts[i * 2], ay = pts[i * 2 + 1], bx = pts[q * 2], by = pts[q * 2 + 1];
    const aox = ax + mx[i], aoy = ay + my[i], aix = ax - mx[i], aiy = ay - my[i];
    const box = bx + mx[q], boy = by + my[q], bix = bx - mx[q], biy = by - my[q];
    out[o++] = aox; out[o++] = aoy; out[o++] = aix; out[o++] = aiy; out[o++] = box; out[o++] = boy;
    out[o++] = aix; out[o++] = aiy; out[o++] = bix; out[o++] = biy; out[o++] = box; out[o++] = boy;
  }
  return o;
}

/* Closest point on the polygon outline to the player, in entity-local coords,
   plus the circumradius — tileShapes.ts:167-191, reproduced. */
function bloomFor(t, pdx, pdy) {
  let bestD2 = Infinity, cgx = 0, cgy = 0, maxR2 = 0;
  for (let i = 0; i < NVERT; i++) {
    const j = (i + 1) % NVERT;
    const axp = t.pts[i * 2], ayp = t.pts[i * 2 + 1];
    const bxp = t.pts[j * 2], byp = t.pts[j * 2 + 1];
    const r2 = axp * axp + ayp * ayp; if (r2 > maxR2) maxR2 = r2;
    const abx = bxp - axp, aby = byp - ayp;
    const apx = pdx - axp, apy = pdy - ayp;
    const sl2 = abx * abx + aby * aby;
    let u = sl2 > 0 ? (apx * abx + apy * aby) / sl2 : 0;
    u = u < 0 ? 0 : u > 1 ? 1 : u;
    const qx = axp + abx * u, qy = ayp + aby * u;
    const d2 = (pdx - qx) * (pdx - qx) + (pdy - qy) * (pdy - qy);
    if (d2 < bestD2) { bestD2 = d2; cgx = qx; cgy = qy; }
  }
  return { cgx, cgy, tileR: Math.sqrt(maxR2) || t.radius };
}

const FILL_FLOATS   = 3 * (NVERT - 2) * 2;   // (n-2) tris * 3 verts * xy
const STROKE_FLOATS = NVERT * 6 * 2;         // n quads * 6 verts * xy
const FILL_VERTS    = FILL_FLOATS / 2;
const STROKE_VERTS  = STROKE_FLOATS / 2;
/* ORDERING, not family, is what the buffer is sorted by. See the draw-order
   note in the header: batching all fills and then all strokes is faster to
   write and produces the WRONG IMAGE the moment two entities overlap, because
   an early entity's stroke lands on top of a later entity's fill. Interleaving
   per entity keeps painter's order AND keeps one draw call. */
const TILE_VERTS    = FILL_VERTS + STROKE_VERTS;
const VERT_FLOATS   = 4;                     // x, y, instIdx, kind

/* ═══ MAIN ════════════════════════════════════════════════════════════════ */
async function main() {
  const e = REPORT.env;
  e.userAgent = navigator.userAgent; e.dpr = devicePixelRatio;
  if (!window.isSecureContext) return fail("Not a secure context — open over https://.");
  if (!navigator.gpu) return fail("navigator.gpu absent.");

  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" })
               || await navigator.gpu.requestAdapter();
  if (!adapter) return fail("requestAdapter() returned null.");
  const canTime = adapter.features.has("timestamp-query");
  const device = await adapter.requestDevice({ requiredFeatures: canTime ? ["timestamp-query"] : [] });
  REPORT.gpu.timestampQuery = canTime;
  REPORT.gpu.adapterInfo = adapter.info ? { vendor: adapter.info.vendor, architecture: adapter.info.architecture } : "(n/a)";
  device.onuncapturederror = (ev) => fail("GPU error: " + ev.error.message);

  const ctxGpu = gpuCv.getContext("webgpu");
  if (!ctxGpu) return fail("getContext('webgpu') returned null.");
  const format = navigator.gpu.getPreferredCanvasFormat();
  /* COPY_SRC so the DIFF check can read the rendered texture directly.
     Screen-scraping the canvas with drawImage() returns blank once the
     compositor has taken the frame — measured, not assumed. */
  ctxGpu.configure({ device, format, alphaMode: "opaque",
    usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  const ctx2d = c2dCv.getContext("2d");

  const DPR_CAP = 2;
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, DPR_CAP);
    W = Math.max(1, Math.round(gpuCv.clientWidth * dpr));
    H = Math.max(1, Math.round(gpuCv.clientHeight * dpr));
    for (const c of [gpuCv, c2dCv]) { c.width = W; c.height = H; }
    ctx2d.imageSmoothingEnabled = false;   // matches RenderSystem.ts:626
    e.backingStore = `${W}x${H} (${(W * H / 1e6).toFixed(2)} Mpx)`;
  }
  /* MSAA. Canvas2D antialiases polygon edges; a sampleCount-1 WebGPU pass
     does not, and the pixel diff below is dominated by that difference. 4x
     is the fix the real port would need — kept TOGGLEABLE because it is not
     free on a mobile GPU (extra fill rate and bandwidth), and the cost of
     matching Canvas2D's quality is itself a finding. */
  let msaa = true, msaaTex = null, msaaView = null;
  function rebuildMsaa() {
    if (msaaTex) msaaTex.destroy();
    msaaTex = msaa ? device.createTexture({ size: [W, H, 1], sampleCount: 4, format,
      usage: GPUTextureUsage.RENDER_ATTACHMENT }) : null;
    msaaView = msaaTex ? msaaTex.createView() : null;
  }
  const _resize = resize;
  resize = function () { _resize(); rebuildMsaa(); };
  resize(); addEventListener("resize", resize);

  /* ── Tiles ──────────────────────────────────────────────────────────── */
  const MAX_TILES = 6000;
  let tiles = [], count = 0;
  const fillScratch = new Float32Array(FILL_FLOATS);
  const strokeScratch = new Float32Array(STROKE_FLOATS);

  function setCount(n) {
    seed = 12345; tiles = []; count = n;
    for (let i = 0; i < n; i++) {
      const t = makeTile(W, H);
      const nd = (rnd() * 4) | 0;
      for (let k = 0; k < nd; k++) dent(t);
      buildPoints(t);
      tiles.push(t);
    }
    resetStats();
  }

  /* ── GPU buffers ────────────────────────────────────────────────────────
     Each tile owns a FIXED SLOT in both vertex buffers, so a dent rewrites
     one sub-range rather than the whole buffer. Fixed vertex count is what
     makes that possible — and it is also how dents really work. */
  const INST_FLOATS = 20;   // posRotScale(4) fill(4) bloomRGBA(4) bloomCR(4) stroke(4)
  const geoVerts = new Float32Array(MAX_TILES * TILE_VERTS * VERT_FLOATS);
  const instData = new Float32Array(MAX_TILES * INST_FLOATS);

  const geoBuf = device.createBuffer({ size: geoVerts.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  const instBuf = device.createBuffer({ size: instData.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const uniBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

  const shader = device.createShaderModule({ code: `
    struct Inst {
      posRot : vec4f,   // x, y, rot, scale
      fill   : vec4f,
      bloom  : vec4f,   // rgb, peak alpha * intensity
      bloomCR: vec4f,   // centre x, centre y, radius, isStroke-unused
      stroke : vec4f,
    };
    struct U { viewport : vec2f, mode : f32, _p : f32 };
    @group(0) @binding(0) var<uniform> u : U;
    @group(0) @binding(1) var<storage, read> insts : array<Inst>;

    struct VSOut {
      @builtin(position) pos : vec4f,
      @location(0) local : vec2f,
      @location(1) @interpolate(flat) idx : u32,
      @location(2) @interpolate(flat) kind : u32,
    };

    @vertex fn vs(@location(0) local : vec2f, @location(1) instIdx : f32,
                  @location(2) kind : f32) -> VSOut {
      let i = u32(instIdx);
      let inst = insts[i];
      let c = cos(inst.posRot.z);
      let s = sin(inst.posRot.z);
      let p = vec2f(local.x * c - local.y * s, local.x * s + local.y * c) + inst.posRot.xy;
      var o : VSOut;
      o.pos = vec4f(p.x / u.viewport.x * 2.0 - 1.0, 1.0 - p.y / u.viewport.y * 2.0, 0.0, 1.0);
      o.local = local;
      o.idx = i;
      o.kind = u32(kind);
      return o;
    }

    // ONE fragment entry for both, branching on kind, so fill and stroke can
    // share a single draw call in entity order.
    //
    // FILL + BLOOM resolve in one pass: Canvas2D needs two fills (base, then
    // the gradient over it), but the gradient is analytic, so the same
    // composite — mix(fill, bloom, bloomAlpha) — is one shader here. A genuine
    // structural advantage, not a shortcut.
    @fragment fn fs(in : VSOut) -> @location(0) vec4f {
      let inst = insts[in.idx];
      if (in.kind == 1u) { return inst.stroke; }
      let d = distance(in.local, inst.bloomCR.xy);
      let t = clamp(1.0 - d / max(inst.bloomCR.z, 1.0), 0.0, 1.0);
      let a = inst.bloom.a * t;
      return vec4f(mix(inst.fill.rgb, inst.bloom.rgb, a), inst.fill.a);
    }` });

  const ci = await shader.getCompilationInfo();
  REPORT.gpu.shaderMessages = ci.messages.map((m) => `${m.type}: ${m.message}`);
  if (ci.messages.some((m) => m.type === "error")) return fail("WGSL:\n" + REPORT.gpu.shaderMessages.join("\n"));

  const blend = {
    color: { srcFactor: "src-alpha", dstFactor: "one-minus-src-alpha", operation: "add" },
    alpha: { srcFactor: "one", dstFactor: "one-minus-src-alpha", operation: "add" },
  };
  const vbLayout = [{
    arrayStride: VERT_FLOATS * 4,
    attributes: [
      { shaderLocation: 0, offset: 0,  format: "float32x2" },
      { shaderLocation: 1, offset: 8,  format: "float32" },
      { shaderLocation: 2, offset: 12, format: "float32" },
    ],
  }];
  const mkPipe = (samples) => device.createRenderPipeline({
    layout: "auto",
    vertex: { module: shader, entryPoint: "vs", buffers: vbLayout },
    fragment: { module: shader, entryPoint: "fs", targets: [{ format, blend }] },
    primitive: { topology: "triangle-list" },
    multisample: { count: samples },
  });
  const pipe = mkPipe(1), pipeMs = mkPipe(4);
  const mkBind = (p) => device.createBindGroup({ layout: p.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: uniBuf } }, { binding: 1, resource: { buffer: instBuf } }] });
  const bind = mkBind(pipe), bindMs = mkBind(pipeMs);

  /* ── Timing ─────────────────────────────────────────────────────────── */
  function makeStats(cap) {
    const b = new Float64Array(cap); let n = 0, h = 0;
    return { push(v) { b[h] = v; h = (h + 1) % cap; if (n < cap) n++; }, clear() { n = 0; h = 0; },
      get count() { return n; },
      summary() { if (!n) return null; const s = Array.prototype.slice.call(b, 0, n).sort((x, y) => x - y);
        const at = (p) => s[Math.min(n - 1, Math.floor(n * p))];
        return { p50: +at(.5).toFixed(2), p95: +at(.95).toFixed(2), p99: +at(.99).toFixed(2), max: +s[n - 1].toFixed(2), n }; } };
  }
  const frameStats = makeStats(900), cpuStats = makeStats(900), gpuStats = makeStats(600), triStats = makeStats(900);
  let querySet = null, resolveBuf = null, readPool = [];
  if (canTime) {
    try {
      querySet = device.createQuerySet({ type: "timestamp", count: 2 });
      resolveBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC });
      for (let i = 0; i < 3; i++) readPool.push({ buf: device.createBuffer({ size: 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ }), busy: false });
    } catch (err) { querySet = null; REPORT.gpu.timestampError = String(err); }
  }

  /* ── State ──────────────────────────────────────────────────────────── */
  let mode = "webgpu";           // webgpu | canvas2d | split
  let ramping = false, rampCount = 0, rampSettle = 0, rampResult = null;
  const DENT_FRACTION = 0.10;    // brief: 10% re-triangulate per frame
  let px = 0, py = 0, ptime = 0;

  function resetStats() { frameStats.clear(); cpuStats.clear(); gpuStats.clear(); triStats.clear(); frames = 0; startedAt = performance.now(); }
  let frames = 0, startedAt = performance.now(), last = performance.now();

  /* Rebuild one tile's geometry and write ONLY its slot. */
  function retriangulate(t, i) {
    buildPoints(t);
    const fN = triangulate(t.pts, NVERT, fillScratch);
    const sN = expandStroke(t.pts, NVERT, 1.0, strokeScratch);   // lineWidth 2 → half 1
    let o = i * TILE_VERTS * VERT_FLOATS;
    for (let k = 0; k < fN; k += 2) {
      geoVerts[o++] = fillScratch[k]; geoVerts[o++] = fillScratch[k + 1];
      geoVerts[o++] = i; geoVerts[o++] = 0;
    }
    for (let k = 0; k < sN; k += 2) {
      geoVerts[o++] = strokeScratch[k]; geoVerts[o++] = strokeScratch[k + 1];
      geoVerts[o++] = i; geoVerts[o++] = 1;
    }
    t.dirty = false;
  }

  function simulate(dt) {
    ptime += dt;
    px = W * 0.5 + Math.cos(ptime * 0.55) * W * 0.36;
    py = H * 0.5 + Math.sin(ptime * 0.42) * H * 0.34;
    const churn = Math.max(1, Math.round(count * DENT_FRACTION));
    for (let k = 0; k < churn; k++) dent(tiles[(rnd() * count) | 0]);
    for (let i = 0; i < count; i++) tiles[i].rot += tiles[i].spin * dt;
  }

  function renderGPU(capture) {
    const t0 = performance.now();
    let dirtyCount = 0;
    for (let i = 0; i < count; i++) if (tiles[i].dirty) { retriangulate(tiles[i], i); dirtyCount++; }
    triStats.push(performance.now() - t0);

    for (let i = 0; i < count; i++) {
      const t = tiles[i];
      const dx = px - t.x, dy = py - t.y;
      const dist = Math.hypot(dx, dy);
      const cosR = Math.cos(-t.rot), sinR = Math.sin(-t.rot);
      const ldx = dx * cosR - dy * sinR, ldy = dx * sinR + dy * cosR;
      const b = bloomFor(t, ldx, ldy);
      const inten = dist < BLOOM_RANGE ? (1 - dist / BLOOM_RANGE) ** 2 : 0;
      let o = i * INST_FLOATS;
      instData[o++] = t.x; instData[o++] = t.y; instData[o++] = t.rot; instData[o++] = 1;
      instData[o++] = t.base[0]; instData[o++] = t.base[1]; instData[o++] = t.base[2]; instData[o++] = 1;
      instData[o++] = 1.0; instData[o++] = 0.86; instData[o++] = 0.55; instData[o++] = PEAK_ALPHA * inten;
      instData[o++] = b.cgx; instData[o++] = b.cgy;
      instData[o++] = Math.max(b.tileR * (0.75 + 2.625 * inten), 1); instData[o++] = 0;
      instData[o++] = 0; instData[o++] = 0; instData[o++] = 0; instData[o++] = 0.3;
    }
    device.queue.writeBuffer(uniBuf, 0, new Float32Array([W, H, 0, 0]));
    device.queue.writeBuffer(instBuf, 0, instData.buffer, 0, count * INST_FLOATS * 4);
    device.queue.writeBuffer(geoBuf, 0, geoVerts.buffer, 0, count * TILE_VERTS * VERT_FLOATS * 4);

    const slot = querySet ? readPool.find((p) => !p.busy) : null;
    const enc = device.createCommandEncoder();
    const canvasTex = ctxGpu.getCurrentTexture();
    const useMs = msaa && msaaView;
    const desc = { colorAttachments: [{
      view: useMs ? msaaView : canvasTex.createView(),
      resolveTarget: useMs ? canvasTex.createView() : undefined,
      clearValue: { r: 0.043, g: 0.067, b: 0.125, a: 1 },
      loadOp: "clear", storeOp: useMs ? "discard" : "store" }] };
    if (slot) desc.timestampWrites = { querySet, beginningOfPassWriteIndex: 0, endOfPassWriteIndex: 1 };
    const pass = enc.beginRenderPass(desc);
    /* ONE draw call total, for any tile count, in entity order. */
    pass.setPipeline(useMs ? pipeMs : pipe);
    pass.setBindGroup(0, useMs ? bindMs : bind);
    pass.setVertexBuffer(0, geoBuf);
    pass.draw(count * TILE_VERTS);
    pass.end();
    if (slot) { slot.busy = true; enc.resolveQuerySet(querySet, 0, 2, resolveBuf, 0); enc.copyBufferToBuffer(resolveBuf, 0, slot.buf, 0, 16); }
    /* Capture rides the SAME encoder as the draw, so it necessarily reads the
       texture that was just rendered rather than whatever survives to the
       next frame. */
    if (capture) enc.copyTextureToBuffer(
      { texture: canvasTex },
      { buffer: capture.buffer, bytesPerRow: capture.bytesPerRow, rowsPerImage: H },
      [W, H, 1]);
    device.queue.submit([enc.finish()]);
    if (slot) slot.buf.mapAsync(GPUMapMode.READ).then(() => {
      const v = new BigUint64Array(slot.buf.getMappedRange().slice(0)); slot.buf.unmap(); slot.busy = false;
      const ns = Number(v[1] - v[0]); if (ns > 0) gpuStats.push(ns / 1e6);
    }).catch(() => { slot.busy = false; });
    return dirtyCount;
  }

  /* The Canvas2D control: the SAME scene through the immediate-mode API the
     real renderer uses — build path, fill, fill again with a radial gradient,
     stroke. No re-triangulation, because Canvas2D does not need one; that
     asymmetry is real and is reported rather than hidden. */
  function renderC2D() {
    ctx2d.setTransform(1, 0, 0, 1, 0, 0);
    ctx2d.fillStyle = "#0b1120";
    ctx2d.fillRect(0, 0, W, H);
    for (let i = 0; i < count; i++) {
      const t = tiles[i];
      if (t.dirty) { buildPoints(t); t.dirty = false; }
      const dx = px - t.x, dy = py - t.y;
      const dist = Math.hypot(dx, dy);
      ctx2d.setTransform(1, 0, 0, 1, t.x, t.y);
      ctx2d.rotate(t.rot);
      ctx2d.beginPath();
      ctx2d.moveTo(t.pts[0], t.pts[1]);
      for (let k = 1; k < NVERT; k++) ctx2d.lineTo(t.pts[k * 2], t.pts[k * 2 + 1]);
      ctx2d.closePath();
      ctx2d.fillStyle = `rgb(${(t.base[0] * 255) | 0},${(t.base[1] * 255) | 0},${(t.base[2] * 255) | 0})`;
      ctx2d.fill();
      if (dist < BLOOM_RANGE) {
        const cosR = Math.cos(-t.rot), sinR = Math.sin(-t.rot);
        const b = bloomFor(t, dx * cosR - dy * sinR, dx * sinR + dy * cosR);
        const inten = (1 - dist / BLOOM_RANGE) ** 2;
        const oR = Math.max(b.tileR * (0.75 + 2.625 * inten), 1);
        const g = ctx2d.createRadialGradient(b.cgx, b.cgy, 0, b.cgx, b.cgy, oR);
        g.addColorStop(0, "rgba(255,219,140,1)");
        g.addColorStop(1, "rgba(255,219,140,0)");
        ctx2d.globalAlpha = PEAK_ALPHA * inten;
        ctx2d.fillStyle = g;
        ctx2d.fill();
        ctx2d.globalAlpha = 1;
      }
      ctx2d.strokeStyle = "rgba(0,0,0,0.3)";
      ctx2d.lineWidth = 2;
      ctx2d.stroke();
    }
    ctx2d.setTransform(1, 0, 0, 1, 0, 0);
  }

  function frame(now) {
    const delta = now - last; last = now;
    if (frames > 0) frameStats.push(delta);
    const dt = Math.min(delta, 50) / 1000;
    const c0 = performance.now();

    if (!frozen) simulate(dt);
    if (frozen) { requestAnimationFrame(frame); return; }   // DIFF owns the canvases
    const showGpu = mode === "webgpu" || mode === "split";
    const showC2d = mode === "canvas2d" || mode === "split";
    gpuCv.style.display = showGpu ? "block" : "none";
    c2dCv.style.display = showC2d ? "block" : "none";
    /* In SPLIT the Canvas2D canvas is clipped to the right half so the two
       renderers are seen side by side on the same frame — the only fair way
       to judge "visually indistinguishable". */
    c2dCv.style.clipPath = mode === "split" ? "inset(0 0 0 50%)" : "none";
    if (showGpu) renderGPU();
    if (showC2d) renderC2D();

    cpuStats.push(performance.now() - c0);
    frames++;

    if (ramping) tickRamp();
    if (frames % 12 === 0) paint();
    requestAnimationFrame(frame);
  }

  /* ── THE RAMP ───────────────────────────────────────────────────────────
     Vsync makes frame time useless as a comparator while work fits budget,
     so instead: raise the tile count until 60fps breaks, and report where.
     This is the primary evidence for KG2's cost condition. */
  function tickRamp() {
    rampSettle++;
    if (rampSettle < 45) return;                 // settle before judging
    const f = frameStats.summary();
    if (!f || f.n < 30) return;
    if (f.p95 > 18.5) {                          // 60fps broken
      rampResult = { renderer: mode, sustained: rampCount, brokeAt: rampCount, p95: f.p95 };
      ramping = false;
      REPORT.runs.push({ type: "ramp", renderer: mode, maxTilesAt60fps: Math.max(0, rampCount - 250),
        brokeAtTiles: rampCount, framep95: f.p95, backingStore: e.backingStore });
      return;
    }
    rampCount += 250;
    if (rampCount > MAX_TILES) { rampResult = { renderer: mode, sustained: MAX_TILES, capped: true }; ramping = false; return; }
    setCount(rampCount); rampSettle = 0;
  }
  function startRamp() { ramping = true; rampCount = 250; rampResult = null; rampSettle = 0; setCount(rampCount); }

  function paint() {
    const f = frameStats.summary(), c = cpuStats.summary(), g = gpuStats.summary(), tr = triStats.summary();
    const fps = f ? (1000 / f.p50).toFixed(1) : "—";
    const cls = f ? (f.p50 <= 17.6 ? "g" : f.p50 <= 22 ? "a" : "r") : "k";
    const dc = mode === "canvas2d" ? "n/a" : "1";
    hud.innerHTML =
      `<span class="w">${mode.toUpperCase()}</span>${mode !== "canvas2d" ? (msaa ? " <span class=\"g\">msaa4</span>" : " <span class=\"a\">no-aa</span>") : ""}  <span class="k">tiles</span> ${count}  `
        + `<span class="k">drawcalls</span> <span class="g">${dc}</span>  <span class="k">fps</span> <span class="${cls}">${fps}</span>\n`
      + `<span class="k">backing</span> ${e.backingStore}   <span class="k">dent churn</span> ${(DENT_FRACTION * 100) | 0}%/frame\n`
      + `<span class="k">frame</span> p50 ${f ? f.p50 : "—"} p95 ${f ? f.p95 : "—"} <span class="a">max ${f ? f.max : "—"}</span>\n`
      + `<span class="k">cpu  </span> p50 ${c ? c.p50 : "—"} p95 ${c ? c.p95 : "—"} max ${c ? c.max : "—"}\n`
      + (mode === "canvas2d"
          ? `<span class="k">gpu  </span> <span class="a">(canvas2d rasterizes async — cpu UNDER-reports)</span>\n`
          : `<span class="k">gpu  </span> ${g ? `p50 ${g.p50} p95 ${g.p95} max ${g.max}` : "(sampling…)"}\n`)
      + `<span class="k">retri</span> ${tr ? `p50 ${tr.p50} max ${tr.max}` : "—"}   <span class="k">frames</span> ${frames}\n`
      + (ramping ? `<span class="a">RAMPING… ${rampCount} tiles</span>`
         : rampResult ? `<span class="g">RAMP ${rampResult.renderer}: broke at ${rampResult.brokeAt || rampResult.sustained}${rampResult.capped ? " (capped)" : ""}</span>`
         : `<span class="k">tap RAMP for the vsync-immune comparison</span>`);
  }

  document.getElementById("b-mode").onclick = () => {
    mode = mode === "webgpu" ? "canvas2d" : "webgpu";
    document.getElementById("b-mode").textContent = mode.toUpperCase();
    resetStats();
  };
  document.getElementById("b-split").onclick = () => { mode = "split"; document.getElementById("b-mode").textContent = "SPLIT"; resetStats(); };
  document.getElementById("b-500").onclick = () => setCount(500);
  document.getElementById("b-ramp").onclick = startRamp;
  document.getElementById("b-msaa").onclick = () => {
    msaa = !msaa; rebuildMsaa();
    const b = document.getElementById("b-msaa");
    b.textContent = msaa ? "MSAA 4x" : "MSAA off";
    b.className = msaa ? "on" : "alt";
    resetStats();
  };

  /* ── DIFF: the quality gate, measured rather than eyeballed ─────────────
     KG2's quality condition ("visually indistinguishable at 1x zoom") is
     otherwise a subjective call made on a phone screen. This freezes the
     simulation, renders the SAME frame with both renderers, and compares
     pixels — so the answer is a number, on the device, and a future reader
     can check it against a threshold instead of trusting an impression. */
  let frozen = false;
  document.getElementById("b-diff").onclick = async () => {
    frozen = true;
    const btn = document.getElementById("b-diff");
    btn.textContent = "…";
    await new Promise((r) => requestAnimationFrame(() => r()));

    /* bytesPerRow must be a multiple of 256, so rows are padded and the
       padding has to be skipped when reading back. */
    const bytesPerRow = Math.ceil(W * 4 / 256) * 256;
    const cap = { buffer: device.createBuffer({ size: bytesPerRow * H,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ }), bytesPerRow };

    renderGPU(cap);
    await device.queue.onSubmittedWorkDone();
    await cap.buffer.mapAsync(GPUMapMode.READ);
    const a = new Uint8Array(cap.buffer.getMappedRange().slice(0));
    cap.buffer.unmap(); cap.buffer.destroy();

    renderC2D();
    const b = ctx2d.getImageData(0, 0, W, H).data;

    /* The canvas format is bgra8unorm; getImageData is RGBA. Comparing them
       channel-for-channel without swizzling would report a large difference
       between two identical images. */
    const bgra = format.startsWith("bgra");
    let sum = 0, over = 0, maxd = 0;
    const N = W * H;
    for (let y = 0; y < H; y++) {
      const rowA = y * bytesPerRow, rowB = y * W * 4;
      for (let x = 0; x < W; x++) {
        const oa = rowA + x * 4, ob = rowB + x * 4;
        const ar = bgra ? a[oa + 2] : a[oa];
        const ag = a[oa + 1];
        const ab = bgra ? a[oa] : a[oa + 2];
        const dr = Math.abs(ar - b[ob]), dg = Math.abs(ag - b[ob + 1]), db = Math.abs(ab - b[ob + 2]);
        const m = dr > dg ? (dr > db ? dr : db) : (dg > db ? dg : db);
        sum += (dr + dg + db) / 3;
        if (m > 8) over++;
        if (m > maxd) maxd = m;
      }
    }
    const res = {
      type: "diff", tiles: count, msaa, backingStore: e.backingStore,
      meanAbsDiff: +(sum / N).toFixed(3),
      pctPixelsOver8: +((over / N) * 100).toFixed(3),
      maxChannelDiff: maxd,
    };
    REPORT.runs.push(res);
    hud.innerHTML = `<span class="w">PIXEL DIFF — WebGPU vs Canvas2D, same frame</span>\n`
      + `<span class="k">tiles</span> ${count}   <span class="k">at</span> ${e.backingStore}\n`
      + `<span class="k">mean abs diff </span> <span class="${res.meanAbsDiff < 2 ? "g" : res.meanAbsDiff < 6 ? "a" : "r"}">${res.meanAbsDiff}</span> / 255\n`
      + `<span class="k">pixels >8    </span> <span class="${res.pctPixelsOver8 < 2 ? "g" : res.pctPixelsOver8 < 8 ? "a" : "r"}">${res.pctPixelsOver8}%</span>\n`
      + `<span class="k">max channel  </span> ${res.maxChannelDiff}\n`
      + `<span class="k">(edge AA differs by nature; bulk fill/bloom should match)</span>`;
    btn.textContent = "DIFF";
    setTimeout(() => { frozen = false; resetStats(); }, 3500);
  };
  document.getElementById("b-copy").onclick = async () => {
    REPORT.runs.push({ type: "scene", renderer: mode, tiles: count, drawCalls: mode === "canvas2d" ? null : 1,
      backingStore: e.backingStore, dentChurnPct: DENT_FRACTION * 100,
      msaa, frameMs: frameStats.summary(), cpuMs: cpuStats.summary(),
      gpuMs: mode === "canvas2d" ? null : gpuStats.summary(), retriangulateMs: triStats.summary(),
      frames, seconds: +((performance.now() - startedAt) / 1000).toFixed(1) });
    const txt = JSON.stringify(REPORT, null, 2);
    try { await navigator.clipboard.writeText(txt); document.getElementById("b-copy").textContent = "COPIED"; }
    catch { hud.textContent = txt; }
    setTimeout(() => (document.getElementById("b-copy").textContent = "COPY"), 1600);
  };

  /* Debug handle, following the repo's own window.__omniEngine convention:
     nothing in the harness reads it, but it lets a headless run drive the
     scene into a specific configuration — which is how the draw-ORDER
     question below was settled rather than argued about. */
  window.__s2 = {
    setCount, tiles: () => tiles, setMode: (m) => { mode = m; resetStats(); },
    setMsaa: (v) => { msaa = v; rebuildMsaa(); },
    freeze: (v) => { frozen = v; },
    overlapTest() {
      setCount(3);
      const mid = [W * 0.5, H * 0.45];
      const spread = 34;
      tiles.forEach((t, i) => {
        t.x = mid[0] + (i - 1) * spread; t.y = mid[1] + (i - 1) * spread * 0.6;
        t.rot = 0; t.spin = 0; t.radius = 90;
        t.base = [[0.85, 0.35, 0.35], [0.35, 0.75, 0.45], [0.4, 0.5, 0.9]][i];
        for (let k = 0; k < NVERT; k++) t.r[k] = 1;
        t.dirty = true;
      });
      buildPoints(tiles[0]);
    },
  };

  setCount(500);
  requestAnimationFrame(frame);
}

main().catch((err) => fail(String((err && err.stack) || err)));
</script>
</body>
</html>
