<!doctype html>
<!--
  OMNI — WebGPU HARNESS  (Stage 1)
  ================================
  THROWAWAY HARNESS, NOT GAME CODE. Standalone, imports nothing, never loaded
  by the app. Delete freely when the spike concludes.

  PURPOSE (Stage 1): establish the toolchain, the WGSL edit loop and a
  MEASUREMENT BASELINE before any hard problem is attempted. It clears to a
  colour and draws textured quads from a real game sprite at the device's true
  backing store, reporting frame-time percentiles on-screen.

  Two things it carries over from Stage 0 deliberately:
    * NEAREST-NEIGHBOUR sampling — Omni sets imageSmoothingEnabled = false
      globally (RenderSystem.ts:626), so a linear sampler would not be
      comparing like with like.
    * GPU-SIDE TIMING via timestamp-query, which the target iPhone reports as
      available. The repo's own renderMs times CPU-side CALL ISSUING, not
      rasterization — the exact hazard a GPU port must not inherit, since a
      GPU renderer moves work OUT of that timer. Proving the instrument here
      is what makes Stage 2's cost gate trustworthy.

  The instance-count control previews HAZARD H3 (draw-call explosion): every
  count below draws in ONE instanced draw call, which is the shape the real
  port must take. If instancing did not work, that is far cheaper to discover
  here than at Stage 5.

  Serve over https (or localhost) — WebGPU needs a secure context.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Omni — WebGPU Harness (Stage 1)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1120; }
  body {
    color: #e2e8f0; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-text-size-adjust: 100%; overflow: hidden;
  }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed; left: 8px; right: 8px; top: 8px; padding: 9px 11px;
    background: rgba(8,14,28,.9); border: 1px solid #1e293b; border-radius: 8px;
    pointer-events: none; white-space: pre; font-size: 11px; line-height: 1.5;
  }
  #ctl {
    position: fixed; left: 8px; right: 8px; bottom: 8px;
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  button {
    flex: 1 1 auto; min-width: 62px; padding: 11px 8px; font: inherit; font-weight: 700;
    color: #0b1120; background: #38bdf8; border: 0; border-radius: 7px; -webkit-appearance: none;
  }
  button.alt { background: #64748b; color: #e2e8f0; }
  button.on  { background: #34d399; }
  .k { color: #7c8da5; } .g { color: #6ee7b7; } .r { color: #fda4af; } .a { color: #fcd34d; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">starting…</div>
<div id="ctl">
  <button id="b-1">1</button>
  <button id="b-100">100</button>
  <button id="b-500">500</button>
  <button id="b-2000">2000</button>
  <button id="b-reset" class="alt">RESET</button>
  <button id="b-copy" class="alt">COPY</button>
</div>

<script>
"use strict";

const REPORT = { stage: "1", when: new Date().toISOString(), env: {}, gpu: {}, runs: [] };
const hud = document.getElementById("hud");
const cv  = document.getElementById("cv");

const fail = (msg) => {
  hud.innerHTML = `<span class="r">HARNESS FAILED</span>\n${msg}`;
  REPORT.error = msg;
};

/* ── Percentile bookkeeping ───────────────────────────────────────────────
   Worst frame is this repo's metric (gauntlet 5c), so max and p99 are
   reported alongside the median rather than an average, which would hide
   exactly the stutter that matters. */
function makeStats(capacity) {
  const buf = new Float64Array(capacity);
  let n = 0, head = 0;
  return {
    push(v) { buf[head] = v; head = (head + 1) % capacity; if (n < capacity) n++; },
    clear() { n = 0; head = 0; },
    get count() { return n; },
    summary() {
      if (n === 0) return null;
      const s = Array.prototype.slice.call(buf, 0, n).sort((a, b) => a - b);
      const at = (p) => s[Math.min(n - 1, Math.floor(n * p))];
      return {
        p50: +at(0.50).toFixed(2), p95: +at(0.95).toFixed(2),
        p99: +at(0.99).toFixed(2), max: +s[n - 1].toFixed(2),
        min: +s[0].toFixed(2), n,
      };
    },
  };
}

async function main() {
  /* ── Environment ────────────────────────────────────────────────────── */
  const e = REPORT.env;
  e.userAgent = navigator.userAgent;
  e.isSecureContext = window.isSecureContext;
  e.dpr = window.devicePixelRatio;
  if (!e.isSecureContext) return fail("Not a secure context — navigator.gpu is hidden. Open over https://.");
  if (!navigator.gpu)     return fail("navigator.gpu is absent. Stage 0's kill gate covers this.");

  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" })
               || await navigator.gpu.requestAdapter();
  if (!adapter) return fail("requestAdapter() returned null.");

  /* timestamp-query must be REQUESTED at device creation, not merely present
     on the adapter. Requesting a feature the adapter lacks throws, so this is
     conditional rather than optimistic. */
  const canTime = adapter.features.has("timestamp-query");
  const device = await adapter.requestDevice({
    requiredFeatures: canTime ? ["timestamp-query"] : [],
  });
  REPORT.gpu.timestampQuery = canTime;
  REPORT.gpu.adapterInfo = adapter.info
    ? { vendor: adapter.info.vendor, architecture: adapter.info.architecture }
    : "(not exposed)";
  device.onuncapturederror = (ev) => fail("uncaptured GPU error: " + ev.error.message);

  const ctx = cv.getContext("webgpu");
  if (!ctx) return fail("getContext('webgpu') returned null.");
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: "opaque" });

  /* ── Backing store ──────────────────────────────────────────────────────
     Reproduces effectiveDpr()'s cap of 2 (constants.ts RENDER_SCALE_CYCLE[0])
     so the harness fills the SAME pixel count the real renderer would, rather
     than whatever the device's raw dpr implies. */
  const DPR_CAP = 2;
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    W = Math.max(1, Math.round(cv.clientWidth  * dpr));
    H = Math.max(1, Math.round(cv.clientHeight * dpr));
    cv.width = W; cv.height = H;
    e.backingStore = `${W}x${H} (${(W * H / 1e6).toFixed(2)} Mpx) @ dpr cap ${DPR_CAP}`;
  }
  resize();
  window.addEventListener("resize", resize);

  /* ── Texture from a real game sprite ────────────────────────────────── */
  let bitmap;
  try {
    const res = await fetch("assets/drone.png");
    if (!res.ok) throw new Error(`assets/drone.png → HTTP ${res.status}`);
    bitmap = await createImageBitmap(await res.blob());
  } catch (err) { return fail("texture load failed: " + err.message); }
  REPORT.gpu.texture = `drone.png ${bitmap.width}x${bitmap.height}`;

  const texture = device.createTexture({
    size: [bitmap.width, bitmap.height, 1],
    format: "rgba8unorm",
    usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT,
  });
  device.queue.copyExternalImageToTexture({ source: bitmap }, { texture }, [bitmap.width, bitmap.height]);
  /* NEAREST, to match the renderer's imageSmoothingEnabled = false. */
  const sampler = device.createSampler({ magFilter: "nearest", minFilter: "nearest" });

  /* ── Pipeline ───────────────────────────────────────────────────────────
     One instanced draw for ANY instance count. Per-instance data lives in a
     storage buffer read by instance_index — no per-entity draw call, which is
     the whole point of H3. */
  const INSTANCE_FLOATS = 12;               // xywh(4) + rot/alpha/pad(4) + tint(4)
  const shader = device.createShaderModule({ code: `
    struct Inst {
      xywh : vec4f,          // centre x, centre y (px), width, height (px)
      rot  : vec4f,          // .x rotation (rad), .y alpha, .zw unused
      tint : vec4f,
    };
    struct U { viewport : vec2f, _pad : vec2f };

    @group(0) @binding(0) var<uniform> u : U;
    @group(0) @binding(1) var<storage, read> insts : array<Inst>;
    @group(0) @binding(2) var samp : sampler;
    @group(0) @binding(3) var tex  : texture_2d<f32>;

    struct VSOut {
      @builtin(position) pos : vec4f,
      @location(0) uv   : vec2f,
      @location(1) tint : vec4f,
    };

    @vertex fn vs(@builtin(vertex_index) vi : u32,
                  @builtin(instance_index) ii : u32) -> VSOut {
      var quad = array<vec2f,6>(
        vec2f(0.0,0.0), vec2f(1.0,0.0), vec2f(0.0,1.0),
        vec2f(0.0,1.0), vec2f(1.0,0.0), vec2f(1.0,1.0));
      let inst = insts[ii];
      let corner = quad[vi];
      let local  = (corner - vec2f(0.5)) * inst.xywh.zw;
      let c = cos(inst.rot.x);
      let s = sin(inst.rot.x);
      let rotated = vec2f(local.x * c - local.y * s, local.x * s + local.y * c);
      let px = inst.xywh.xy + rotated;
      // Pixel space -> NDC. y flips because pixel y grows downward.
      let ndc = vec2f(px.x / u.viewport.x * 2.0 - 1.0,
                      1.0 - px.y / u.viewport.y * 2.0);
      var o : VSOut;
      o.pos  = vec4f(ndc, 0.0, 1.0);
      o.uv   = corner;
      o.tint = vec4f(inst.tint.rgb, inst.tint.a * inst.rot.y);
      return o;
    }

    @fragment fn fs(in : VSOut) -> @location(0) vec4f {
      let t = textureSample(tex, samp, in.uv);
      return vec4f(t.rgb * in.tint.rgb, t.a * in.tint.a);
    }` });

  const ci = await shader.getCompilationInfo();
  REPORT.gpu.shaderMessages = ci.messages.map((m) => `${m.type}: ${m.message}`);
  if (ci.messages.some((m) => m.type === "error")) {
    return fail("WGSL compile error:\n" + REPORT.gpu.shaderMessages.join("\n"));
  }

  const pipeline = device.createRenderPipeline({
    layout: "auto",
    vertex:   { module: shader, entryPoint: "vs" },
    fragment: { module: shader, entryPoint: "fs", targets: [{
      format,
      blend: {  // straight alpha, matching Canvas2D's default source-over
        color: { srcFactor: "src-alpha", dstFactor: "one-minus-src-alpha", operation: "add" },
        alpha: { srcFactor: "one",       dstFactor: "one-minus-src-alpha", operation: "add" },
      },
    }] },
    primitive: { topology: "triangle-list" },
  });

  const uniformBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

  /* ── Instances ──────────────────────────────────────────────────────── */
  const MAX_INSTANCES = 4096;
  let instanceBuf = device.createBuffer({
    size: MAX_INSTANCES * INSTANCE_FLOATS * 4,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });
  const instanceData = new Float32Array(MAX_INSTANCES * INSTANCE_FLOATS);
  const bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: uniformBuf } },
      { binding: 1, resource: { buffer: instanceBuf } },
      { binding: 2, resource: sampler },
      { binding: 3, resource: texture.createView() },
    ],
  });

  let count = 1;
  const sprites = [];
  function seed(n) {
    sprites.length = 0;
    for (let i = 0; i < n; i++) {
      sprites.push({
        x: Math.random(), y: Math.random(),        // normalised, scaled at write time
        vx: (Math.random() - 0.5) * 0.08, vy: (Math.random() - 0.5) * 0.08,
        size: n === 1 ? 256 : 26 + Math.random() * 30,
        rot: Math.random() * Math.PI * 2, spin: (Math.random() - 0.5) * 1.5,
        r: 0.6 + Math.random() * 0.4, g: 0.7 + Math.random() * 0.3, b: 0.85 + Math.random() * 0.15,
      });
    }
  }
  seed(count);

  /* ── GPU timing ─────────────────────────────────────────────────────────
     A small pool of readback buffers, because a mapped buffer cannot be
     written by the next frame's resolve. Timing is sampled opportunistically:
     if no buffer is free, the frame is simply not GPU-timed. Values may be
     coarsely quantised by the browser for privacy — treated as indicative. */
  const gpuStats = makeStats(600);
  let querySet = null, resolveBuf = null, readPool = [];
  if (canTime) {
    try {
      querySet   = device.createQuerySet({ type: "timestamp", count: 2 });
      resolveBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC });
      for (let i = 0; i < 3; i++) {
        readPool.push({ buf: device.createBuffer({ size: 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ }), busy: false });
      }
    } catch (err) { REPORT.gpu.timestampError = String(err); querySet = null; }
  }

  /* ── Frame loop ─────────────────────────────────────────────────────── */
  const frameStats = makeStats(1200);   // rAF delta — the honest wall-clock metric
  const cpuStats   = makeStats(1200);   // JS time spent issuing the frame
  let last = performance.now(), frames = 0, startedAt = performance.now();

  function writeInstances(dt) {
    let o = 0;
    for (let i = 0; i < sprites.length; i++) {
      const s = sprites[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.spin * dt;
      if (s.x < 0) s.x += 1; else if (s.x > 1) s.x -= 1;   // torus wrap, like the game
      if (s.y < 0) s.y += 1; else if (s.y > 1) s.y -= 1;
      instanceData[o++] = s.x * W; instanceData[o++] = s.y * H;
      instanceData[o++] = s.size;  instanceData[o++] = s.size;
      instanceData[o++] = s.rot;   instanceData[o++] = 1;
      instanceData[o++] = 0;       instanceData[o++] = 0;
      instanceData[o++] = s.r;     instanceData[o++] = s.g;
      instanceData[o++] = s.b;     instanceData[o++] = 1;
    }
    device.queue.writeBuffer(instanceBuf, 0, instanceData.buffer, 0, sprites.length * INSTANCE_FLOATS * 4);
  }

  function frame(now) {
    const delta = now - last; last = now;
    if (frames > 0) frameStats.push(delta);
    const cpu0 = performance.now();

    device.queue.writeBuffer(uniformBuf, 0, new Float32Array([W, H, 0, 0]));
    writeInstances(Math.min(delta, 50) / 1000);

    const slot = querySet ? readPool.find((p) => !p.busy) : null;
    const enc = device.createCommandEncoder();
    const passDesc = {
      colorAttachments: [{
        view: ctx.getCurrentTexture().createView(),
        clearValue: { r: 0.043, g: 0.067, b: 0.125, a: 1 },
        loadOp: "clear", storeOp: "store",
      }],
    };
    if (slot) passDesc.timestampWrites = { querySet, beginningOfPassWriteIndex: 0, endOfPassWriteIndex: 1 };

    const pass = enc.beginRenderPass(passDesc);
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bindGroup);
    /* ONE draw call for every instance — H3's required shape. */
    pass.draw(6, sprites.length);
    pass.end();

    if (slot) {
      slot.busy = true;
      enc.resolveQuerySet(querySet, 0, 2, resolveBuf, 0);
      enc.copyBufferToBuffer(resolveBuf, 0, slot.buf, 0, 16);
    }
    device.queue.submit([enc.finish()]);

    if (slot) {
      slot.buf.mapAsync(GPUMapMode.READ).then(() => {
        const t = new BigUint64Array(slot.buf.getMappedRange().slice(0));
        slot.buf.unmap(); slot.busy = false;
        const ns = Number(t[1] - t[0]);
        if (ns > 0) gpuStats.push(ns / 1e6);          // ns → ms
      }).catch(() => { slot.busy = false; });
    }

    cpuStats.push(performance.now() - cpu0);
    frames++;
    if (frames % 15 === 0) paint();
    requestAnimationFrame(frame);
  }

  function paint() {
    const f = frameStats.summary(), c = cpuStats.summary(), g = gpuStats.summary();
    const fps = f ? (1000 / f.p50).toFixed(1) : "—";
    const cls = f ? (f.p50 <= 17.5 ? "g" : f.p50 <= 22 ? "a" : "r") : "k";
    hud.innerHTML =
      `<span class="k">instances</span> ${sprites.length}   <span class="k">draw calls</span> <span class="g">1</span>   `
        + `<span class="k">fps</span> <span class="${cls}">${fps}</span>\n`
      + `<span class="k">backing  </span> ${e.backingStore}\n`
      + `<span class="k">frame ms </span> p50 ${f ? f.p50 : "—"}  p95 ${f ? f.p95 : "—"}  p99 ${f ? f.p99 : "—"}  `
        + `<span class="a">max ${f ? f.max : "—"}</span>\n`
      + `<span class="k">cpu ms   </span> p50 ${c ? c.p50 : "—"}  p95 ${c ? c.p95 : "—"}  max ${c ? c.max : "—"}\n`
      + `<span class="k">gpu ms   </span> ${g ? `p50 ${g.p50}  p95 ${g.p95}  max ${g.max}  (n=${g.n})`
            : (canTime ? "(sampling…)" : "(timestamp-query unavailable)")}\n`
      + `<span class="k">frames   </span> ${frames}  over ${((performance.now() - startedAt) / 1000).toFixed(1)}s`;
  }

  function reset() {
    frameStats.clear(); cpuStats.clear(); gpuStats.clear();
    frames = 0; startedAt = performance.now(); last = performance.now();
  }
  function setCount(n) { count = n; seed(n); reset(); }

  document.getElementById("b-1").onclick    = () => setCount(1);
  document.getElementById("b-100").onclick  = () => setCount(100);
  document.getElementById("b-500").onclick  = () => setCount(500);
  document.getElementById("b-2000").onclick = () => setCount(2000);
  document.getElementById("b-reset").onclick = reset;
  document.getElementById("b-copy").onclick = async () => {
    REPORT.runs.push({
      instances: sprites.length, drawCalls: 1, backingStore: e.backingStore,
      frameMs: frameStats.summary(), cpuMs: cpuStats.summary(), gpuMs: gpuStats.summary(),
      frames, seconds: +((performance.now() - startedAt) / 1000).toFixed(1),
    });
    const txt = JSON.stringify(REPORT, null, 2);
    try { await navigator.clipboard.writeText(txt); document.getElementById("b-copy").textContent = "COPIED"; }
    catch { hud.textContent = txt; }
    setTimeout(() => (document.getElementById("b-copy").textContent = "COPY"), 1800);
  };

  requestAnimationFrame(frame);
}

main().catch((err) => fail(String(err && err.stack || err)));
</script>
</body>
</html>
